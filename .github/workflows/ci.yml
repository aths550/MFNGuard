name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Dependencies
      run: npm ci
      working-directory: .

    - name: Build Next.js Application
      run: npm run build
      env:
        NEXT_PUBLIC_NETWORK_ID: preview
        NEXT_PUBLIC_INDEXER_URL: https://indexer.preview.midnight.network/api/v4/graphql
        NEXT_PUBLIC_INDEXER_WS_URL: wss://indexer.preview.midnight.network/api/v4/graphql/ws
        NEXT_PUBLIC_NODE_URL: https://rpc.preview.midnight.network
        NEXT_PUBLIC_PROOF_SERVER_URL: http://127.0.0.1:6300

    - name: Run Linting
      run: npm run lint
      continue-on-error: true # Known misconfiguration in the starter template for this specific step
